name: Сборка и деплой

on:
  push:
    branches: [main]
    # Правка в Android-клиенте или в документации сервера не касается — гонять из-за неё
    # пересборку образа и деплой незачем. Смешанный коммит деплой всё равно запустит.
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Два деплоя одновременно — верный способ получить непонятно что на сервере.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PskipAndroid :server:test

  deploy:
    name: Образ и деплой
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vitz-music-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Деплой по SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${HOST_KEY:-}" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            # Запасной вариант на первый запуск. Лучше положить ключ в секрет
            # DEPLOY_HOST_KEY: иначе первое подключение доверяет тому, кто ответил.
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # Файлы, которые задают конфигурацию стенда, едут вместе с релизом:
          # иначе правка docker-compose.yml в репозитории до сервера не доезжает.
          scp -i ~/.ssh/id_ed25519 docker-compose.yml docker-compose.prod.yml "$USER@$HOST:/srv/vitz-music/"
          scp -i ~/.ssh/id_ed25519 scripts/deploy.sh "$USER@$HOST:/srv/vitz-music/scripts/"
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "chmod +x /srv/vitz-music/scripts/deploy.sh && /srv/vitz-music/scripts/deploy.sh ${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
