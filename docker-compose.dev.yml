# Оверлей для разработки: ни Traefik, ни Caddy нет, сервер слушается напрямую.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Порт базы 5434, а не 5432: на машине разработки обычно уже висит чужой Postgres.
# Если сервер запускается из IDE или ./gradlew :server:run — поднимайте только postgres.
services:
  postgres:
    ports:
      - "5434:5432"

  server:
    ports:
      - "8080:8080"
    environment:
      VM_PUBLIC_URL: http://localhost:8080
