# Базовый набор: база и сервер. Обратного прокси здесь нет намеренно —
# на боевом сервере его роль играет чужой Traefik (см. docker-compose.prod.yml),
# а локально сервер слушается напрямую (docker-compose.dev.yml).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  server:
    # На сервере образ приезжает из GHCR (VM_IMAGE подставляет scripts/deploy.sh),
    # локально собирается этой же командой: docker compose build server.
    image: ${VM_IMAGE:-vitz-music-server:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      VM_DB_USER: ${POSTGRES_USER}
      VM_DB_PASSWORD: ${POSTGRES_PASSWORD}
      VM_JWT_SECRET: ${VM_JWT_SECRET}
      VM_MEDIA_SIGN_SECRET: ${VM_MEDIA_SIGN_SECRET}
      VM_MEDIA_ROOT: /media
      VM_PUBLIC_URL: ${VM_PUBLIC_URL:-https://${VM_DOMAIN}}
      VM_BOOTSTRAP_ADMIN_EMAIL: ${VM_BOOTSTRAP_ADMIN_EMAIL:-}
      VM_BOOTSTRAP_ADMIN_PASSWORD: ${VM_BOOTSTRAP_ADMIN_PASSWORD:-}
      VM_ACCESS_TTL_MINUTES: ${VM_ACCESS_TTL_MINUTES:-15}
      VM_REFRESH_TTL_DAYS: ${VM_REFRESH_TTL_DAYS:-30}
      VM_SIGN_TTL_SECONDS: ${VM_SIGN_TTL_SECONDS:-21600}
      VM_UPLOAD_MAX_BYTES: ${VM_UPLOAD_MAX_BYTES:-209715200}
      VM_WORKER_CONCURRENCY: ${VM_WORKER_CONCURRENCY:-2}
      VM_TRASH_RETENTION_DAYS: ${VM_TRASH_RETENTION_DAYS:-30}
      VM_GC_INTERVAL_MINUTES: ${VM_GC_INTERVAL_MINUTES:-360}
      VM_GC_ORPHAN_GRACE_HOURS: ${VM_GC_ORPHAN_GRACE_HOURS:-24}
    volumes:
      - media:/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  media:
